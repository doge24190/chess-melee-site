name: Sync verified demo release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Verified release tag; leave blank to use the latest release"
        required: false
        type: string
  repository_dispatch:
    types: [chess-melee-release-published]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-chess-melee-demo-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Synchronize verified release metadata
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        shell: bash
        run: |
          tag="${INPUT_TAG:-${DISPATCH_TAG:-}}"
          if [[ -n "$tag" ]]; then
            node scripts/sync-latest-release.mjs --tag "$tag"
          else
            node scripts/sync-latest-release.mjs
          fi

          if git diff --quiet -- data/latest-release.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: npm ci

      - name: Validate website
        if: steps.sync.outputs.changed == 'true'
        run: npm test

      - name: Commit verified release metadata
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          tag="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('data/latest-release.json', 'utf8')).tag)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-release.json
          git commit -m "Sync demo release ${tag}"
          git push origin HEAD:main
